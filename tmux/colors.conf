# tmux colors — generated by matugen

# Status bar
set -g status-style "bg=#313244,fg=#cdd6f4"
set -g status-left-style "fg=#cba6f7"
set -g status-right-style "fg=#a6adc8"

# Active/inactive window in status bar
set -g window-status-current-style "fg=#cba6f7,bold"
set -g window-status-style "fg=#a6adc8"

# Pane borders
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#cba6f7"

# Messages
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cba6f7"

# Mode (copy mode highlight)
set -g mode-style "bg=#cba6f7,fg=#11111b"
