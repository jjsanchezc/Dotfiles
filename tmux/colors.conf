# tmux colors — generated by matugen

# Status bar
set -g status-style "bg=#241f17,fg=#ece1d4"
set -g status-left-style "fg=#f0bf6d"
set -g status-right-style "fg=#d2c4b4"

# Active/inactive window in status bar
set -g window-status-current-style "fg=#f0bf6d,bold"
set -g window-status-style "fg=#d2c4b4"

# Pane borders
set -g pane-border-style "fg=#4e4539"
set -g pane-active-border-style "fg=#f0bf6d"

# Messages
set -g message-style "bg=#241f17,fg=#ece1d4"
set -g message-command-style "bg=#241f17,fg=#f0bf6d"

# Mode (copy mode highlight)
set -g mode-style "bg=#f0bf6d,fg=#432c00"
