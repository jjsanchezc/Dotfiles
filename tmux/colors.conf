# tmux colors — generated by matugen

# Status bar
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left-style "fg=#fe8019"
set -g status-right-style "fg=#bdae93"

# Active/inactive window in status bar
set -g window-status-current-style "fg=#fe8019,bold"
set -g window-status-style "fg=#bdae93"

# Pane borders
set -g pane-border-style "fg=#7c6f64"
set -g pane-active-border-style "fg=#fe8019"

# Messages
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#fe8019"

# Mode (copy mode highlight)
set -g mode-style "bg=#fe8019,fg=#282828"
