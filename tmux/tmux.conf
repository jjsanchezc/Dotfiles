#Real screen colors
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

#resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Start window and pane at 1
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1

# Move across windows
bind -n M-H previous-window
bind -n M-L next-window

# change panes
set -g @plugin 'christoomey/vim-tmux-navigator'
bind-key h select-pane -L
bind-key J select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# New panes in CWD
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

#yanking (copy)
set -g @plugin 'tmux-plugins/tmux-yank'
## set vi/mode
set-window-option -g mode-keys vi

## keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# Theme
set -g @plugin 'catppuccin/tmux'
## Tmux bar
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @tmux-dotbar-position top
set -g @tmux-dotbar-ssh-icon '󰌘'
set -g @tmux-dotbar-ssh-icon-only false
set -g @tmux-dotbar-ssh-enabled true


#Tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'

# Matugen-generated colors — never actually sourced before 2026-08-09, so
# tmux's theme never updated even though matugen was already regenerating
# this file on every wallpaper-set. Must come *after* the TPM run line above:
# the catppuccin/tmux and tmux-dotbar theme plugins set their own
# status/pane-border styles when they load, and "last set wins" in tmux —
# sourcing this any earlier gets immediately overridden by them.
# -q suppresses the error on a fresh clone before colors.conf exists yet.
source-file -q ~/.config/tmux/colors.conf
