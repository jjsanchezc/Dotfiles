general {
    lock_cmd = pidof hyprlock || hyprlock                                    # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                 # lock before suspend — hypridle listens for this signal itself and runs lock_cmd above.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'   # avoid having to press a key twice to turn the display back on.
}

listener {
    timeout = 300                                # 5 min.
    on-timeout = brightnessctl -s set 10         # dim screen backlight, avoid 0 on an OLED-style panel.
    on-resume = brightnessctl -r                 # restore screen backlight.
}

listener {
    timeout = 150                                          # 2.5 min. ASUS keyboard backlight — device confirmed via `brightnessctl -l` (not the generic rgb:kbd_backlight name).
    on-timeout = brightnessctl -sd asus::kbd_backlight set 0
    on-resume = brightnessctl -rd asus::kbd_backlight
}

listener {
    timeout = 360                                 # 6 min.
    on-timeout = loginctl lock-session            # lock screen.
}

listener {
    timeout = 390                                                                                # 6.5 min.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'                          # screen off.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r        # screen on + restore backlight when activity resumes.
}

listener {
    timeout = 1200                                # 20 min.
    on-timeout = systemctl suspend                # suspend the machine.
}
